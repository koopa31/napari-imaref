name: napari-stereotypage
display_name: Napari Stereotyping
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/manifest.html for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-stereotypage.get_reader
      python_name: napari_stereotypage._reader:napari_get_reader
      title: Open data with Napari Stereotyping
    - id: napari-stereotypage.write_multiple
      python_name: napari_stereotypage._writer:write_multiple
      title: Save multi-layer data with Napari Stereotyping
    - id: napari-stereotypage.write_single_image
      python_name: napari_stereotypage._writer:write_single_image
      title: Save image data with Napari Stereotyping
    - id: napari-stereotypage.make_sample_data
      python_name: napari_stereotypage._sample_data:make_sample_data
      title: Load sample data from Napari Stereotyping
    - id: napari-stereotypage.make_container_widget
      python_name: napari_stereotypage:ImageThreshold
      title: Make threshold Container widget
    - id: napari-stereotypage.make_magic_widget
      python_name: napari_stereotypage:threshold_magic_widget
      title: Make threshold magic widget
    - id: napari-stereotypage.make_function_widget
      python_name: napari_stereotypage:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: napari-stereotypage.make_qwidget
      python_name: napari_stereotypage:ExampleQWidget
      title: Make example QWidget
  readers:
    - command: napari-stereotypage.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: napari-stereotypage.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-stereotypage.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  sample_data:
    - command: napari-stereotypage.make_sample_data
      display_name: Napari Stereotyping
      key: unique_id.1
  widgets:
    - command: napari-stereotypage.make_container_widget
      display_name: Container Threshold
    - command: napari-stereotypage.make_magic_widget
      display_name: Magic Threshold
    - command: napari-stereotypage.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: napari-stereotypage.make_qwidget
      display_name: Example QWidget
