name: napari_stereotypage
display_name: Napari Stereotyping
visibility: public
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari_stereotypage.get_reader
      python_name: napari_stereotypage._reader:napari_get_reader
      title: Open data with Napari Stereotyping
    - id: napari_stereotypage.write_multiple
      python_name: napari_stereotypage._writer:write_multiple
      title: Save multi-layer data with Napari Stereotyping
    - id: napari_stereotypage.write_single_image
      python_name: napari_stereotypage._writer:write_single_image
      title: Save image data with Napari Stereotyping
    - id: napari_stereotypage.make_stereotyping_widget
      python_name: napari_stereotypage._widget:StereotypingWidget
      title: Stereotyping Widget
    - id: napari_stereotypage.make_points_transformation_widget
      python_name: napari_stereotypage._points_transformation_widget:CoordinateTransformationWidget
      title: Coordinates Transformation Widget
  readers:
    - command: napari_stereotypage.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: napari_stereotypage.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari_stereotypage.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  widgets:
    - command: napari_stereotypage.make_stereotyping_widget
      display_name: Stereotyping Widget
    - command: napari_stereotypage.make_points_transformation_widget
      display_name: Coordinates Transformation Widget
